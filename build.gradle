plugins {
    // Apply the application plugin to add support for building a CLI application
    id 'application'

    // Apply the java plugin to add support for Java
    id 'java'

    // Protoc plugin
    id 'com.google.protobuf' version '0.8.19'

    id 'eclipse'
    id 'idea'
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

version = '2.0.0'

var shouldGenerateProto = System.getenv("GENERATE_PROTO") == "true"
System.out.println(shouldGenerateProto ?
        "启用旧版生成目录清理；版本化消息按各自任务生成" :
        "保留旧版生成源码；版本化消息按各自任务生成")

repositories {
    mavenCentral()
    jcenter()
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.24.3'
    }

    plugins {
        quickbuf {
            artifact = 'us.hebi.quickbuf:protoc-gen-quickbuf:1.3.1'
        }
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                remove java
            }
            task.plugins {
                quickbuf {
                    //option 'store_unknown_fields=true'
                    outputSubDir = ''
                }
            }
        }

        // 版本化小消息单独生成，避免触碰已跟踪的旧版协议源码。
        ofSourceSet('release450').each { task ->
            task.doFirst {
                logger.lifecycle('仅生成 release450 消息，旧版 main 协议源码保持不变。')
            }
        }
    }

    generatedFilesBaseDir = "$projectDir/src/generated/"
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.17'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.5.32'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.32'

    implementation group: 'it.unimi.dsi', name: 'fastutil-core', version: '8.5.18'
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'

    implementation group: 'com.google.code.gson', name: 'gson', version: '2.13.2'
    implementation group: 'us.hebi.quickbuf', name: 'quickbuf-runtime', version: '1.4'

    implementation group: 'io.javalin', name: 'javalin', version: '6.7.0'

    implementation group: 'io.netty', name: 'netty-common', version: '4.1.132.Final'
    implementation group: 'io.netty', name: 'netty-handler', version: '4.1.132.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-epoll', version: '4.1.132.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-kqueue', version: '4.1.132.Final'

    implementation group: 'dev.morphia.morphia', name: 'morphia-core', version: '2.3.9'
    implementation group: 'de.bwaldvogel', name: 'mongo-java-server', version: '1.44.0'
    implementation group: 'de.bwaldvogel', name: 'mongo-java-server-h2-backend', version: '1.44.0'

    implementation group: 'org.jline', name: 'jline', version: '3.30.9'
    implementation group: 'org.jline', name: 'jline-terminal-jansi', version: '3.30.9'

    protobuf files('proto/')

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j'
}

clean {
    if (shouldGenerateProto) {
        delete protobuf.generatedFilesBaseDir
    }
}

application {
    // Define the main class for the application
    mainClass.set('emu.lunarcore.LunarCore')
}

run {
    // Set the standard input to wait for user input
    standardInput = System.in
}

jar {
	dependsOn 'injectGitHash'

	exclude '*.proto'

    manifest {
        attributes 'Main-Class': 'emu.lunarcore.LunarCore'
    }

    jar {
        archiveBaseName = 'LunarCore'
        archiveVersion = ''
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    getDestinationDirectory().set(file("."))
}

sourceSets {
    // 插件自动使用 src/release450/proto，不重复登记同一路径。
    release450 {}
    main {
        proto {
            srcDir 'src/generated'
        }
        java {
            srcDir 'src/main/java'
        }
        compileClasspath += sourceSets.release450.output
        runtimeClasspath += sourceSets.release450.output
    }
    test {
        compileClasspath += sourceSets.release450.output
        runtimeClasspath += sourceSets.release450.output
    }
}

// 沿用现有依赖版本，不另建运行库或生成器工具链。
configurations.release450Implementation.extendsFrom configurations.implementation
tasks.named('compileRelease450Java') {
    options.encoding = 'UTF-8'
}
tasks.named('jar') {
    from sourceSets.release450.output
}

idea {
    module {
        // proto files and generated Java files are automatically added as
        // source dirs.
        // If you have additional sources, add them here:
        sourceDirs += file('/proto/')
    }
}

eclipse {
    classpath {
        file.whenMerged { cp ->
            cp.entries.add( new org.gradle.plugins.ide.eclipse.model.SourceFolder('src/generated/main/', null) )
        }
    }
}

tasks.register('injectGitHash') {
    def gitCommitHash = {
        try {
            return 'git rev-parse --verify --short HEAD'.execute().text.trim()
        } catch (ignored) {
            return ''
        }
    }
    
    def gitCommitTime = {
        try {
            return 'git log -1 --format=%at --date=raw'.execute().text.trim()
        } catch (ignored) {
            return '0'
        }
    }

    new File(project.projectDir.getAbsolutePath() + '/src/main/java/emu/lunarcore/BuildConfig.java').text = """
package emu.lunarcore;

public final class BuildConfig {
	public static final String VERSION = \"${version}\";
    public static final String GIT_HASH = \"${gitCommitHash()}\";
    public static final String GIT_TIMESTAMP = \"${gitCommitTime()}\";
}
"""
}

task updateProto {
    group 'Build'
    description 'Cleans generated proto folder and regenerates protos'

    if (shouldGenerateProto) {
        dependsOn 'clean'
    }

    dependsOn 'generateProto'
}

processResources {
    dependsOn 'generateProto'
}

// 只验证旧版离线协议基线，不启动客户端、服务监听或数据库。
tasks.register('s0BaselineTest', JavaExec) {
    group = 'verification'
    description = '验证 S0 的旧版协议黄金样本、封包及错误输入'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('emu.lunarcore.S0BaselineRegression')
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    if (providers.gradleProperty('s0NegativeControl').orNull == 'true') {
        args '--negative-control'
    }
}

tasks.named('check') {
    dependsOn tasks.named('s0BaselineTest')
}

// 只验证错误响应的字段投影和既有封包，不启动客户端、网络或数据库。
tasks.register('release450CocoonErrorTest', JavaExec) {
    group = 'verification'
    description = '验证正式构建候选的茧错误响应字段与原封包'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('emu.lunarcore.Release450CocoonErrorRegression')
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    if (providers.gradleProperty('release450NegativeControl').orNull == 'true') {
        args '--negative-control'
    }
}

tasks.named('check') {
    dependsOn tasks.named('release450CocoonErrorTest')
}

// 候选链与原收包/分发的离线回归；运行目录隔离，避免生成测试配置到检出根。
tasks.register('candidate450Test', JavaExec) {
    group = 'verification'
    description = '验证最小链候选映射、会话分发与帧错误分类'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('emu.lunarcore.server.game.Candidate450Regression')
    workingDir layout.buildDirectory.dir('candidate450-test').get().asFile
    doFirst { workingDir.mkdirs() }
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    if (providers.gradleProperty('candidate450NegativeControl').orNull == 'true') {
        args '--negative-control'
    }
}

tasks.named('check') {
    dependsOn tasks.named('candidate450Test')
}

// 显式指定已有资源时才运行；仅建立回环 HTTP 与独立内存数据库，不启动客户端。
tasks.register('candidate450ResourceSmoke', JavaExec) {
    group = 'verification'
    description = '用已有资源验证固定角色、原业务处理器和断开后数据读取'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('emu.lunarcore.server.game.Candidate450ResourceSmoke')
    maxHeapSize = '3g'
    workingDir layout.buildDirectory.dir('candidate450-resource-smoke').get().asFile
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    doFirst {
        workingDir.mkdirs()
        def resources = providers.gradleProperty('candidate450Resources').orNull
        if (!resources) throw new GradleException('需要 -Pcandidate450Resources 指定已有资源；不自动下载资源')
        args file(resources).absolutePath
        def loginOnly = providers.gradleProperty('candidate450LoginOnly').orNull
        if (loginOnly != null && loginOnly != 'true' && loginOnly != 'false') {
            throw new GradleException('candidate450LoginOnly 只接受 true 或 false')
        }
        if (loginOnly == 'true') args '--login-only'
        def mitm = providers.gradleProperty('candidate450Mitm').orNull
        if (mitm != null && mitm != 'true' && mitm != 'false') {
            throw new GradleException('candidate450Mitm 只接受 true 或 false')
        }
        if (mitm == 'true') {
            if (loginOnly != 'true') throw new GradleException('MITM模式仅允许与candidate450LoginOnly=true一起使用')
            args '--mitm'
        }
    }
}
