// 从固定参考描述表提取的候选投影；不是正式客户端已验证的完整协议。
syntax = "proto3";
package lunarcore.release450.candidate;
option java_package = "emu.lunarcore.proto.v450.candidate";
option java_outer_classname = "Candidate450";

message Avatar {
  uint32 base_avatar_id = 8;
  uint32 level = 2;
  bool is_marked = 6;
  uint32 equipment_unique_id = 12;
  uint32 exp = 7;
  uint32 cur_multi_path_avatar_type = 9;
  uint32 promotion = 11;
  uint64 first_met_time_stamp = 4;
  repeated uint32 has_taken_promotion_reward_list = 3 [packed = true];
}

message AvatarBattleInfo {
  AvatarType avatar_type = 1;
  uint32 id = 2;
  double total_damage = 10;
  uint32 stage_id = 15;
}

message AvatarPathData {
  uint32 avatar_id = 1;
  repeated EquipRelic equip_relic_list = 10;
  uint32 path_equipment_id = 14;
  uint32 dressed_skin_id = 3;
  uint64 unlock_timestamp = 5;
  uint32 rank = 4;
  repeated AvatarPathSkillTree avatar_path_skill_tree = 12;
}

message AvatarPathSkillTree {
  uint32 point_id = 12;
  uint32 level = 7;
}

message AvatarSkillTree {
  uint32 point_id = 1;
  uint32 level = 2;
}

enum AvatarType {
  AvatarType_AVATAR_TYPE_NONE = 0;
  AvatarType_AVATAR_TRIAL_TYPE = 1;
  AvatarType_AVATAR_LIMIT_TYPE = 2;
  AvatarType_AVATAR_FORMAL_TYPE = 3;
  AvatarType_AVATAR_ASSIST_TYPE = 4;
  AvatarType_AVATAR_AETHER_DIVIDE_TYPE = 5;
  AvatarType_AVATAR_UPGRADE_AVAILABLE_TYPE = 6;
  AvatarType_AVATAR_GRID_FIGHT_TYPE = 7;
  AvatarType_AVATAR_FIXED_PATH_TYPE = 8;
  AvatarType_AVATAR_RETURN_ASSIST_TYPE = 9;
}

message BattleAvatar {
  AvatarType avatar_type = 1;
  uint32 id = 2;
  uint32 level = 3;
  uint32 rank = 4;
  uint32 index = 5;
  repeated AvatarSkillTree skilltree_list = 6;
  repeated BattleEquipment equipment_list = 7;
  uint32 hp = 8;
  uint32 promotion = 10;
  repeated BattleRelic relic_list = 11;
  uint32 world_level = 12;
  uint32 assist_uid = 13;
  SpBarInfo sp_bar = 16;
  uint32 enhanced_id = 19;
}

message BattleBuff {
  uint32 id = 1;
  uint32 level = 2;
  uint32 owner_index = 3;
  uint32 wave_flag = 4;
  repeated uint32 target_index_list = 5 [packed = true];
  repeated BattleBuff_DynamicValuesEntry dynamic_values = 6;
}

message BattleBuff_DynamicValuesEntry {
  string key = 1;
  float value = 2;
}

enum BattleEndReason {
  BattleEndReason_BADALKDAOGH_NLCDGIPGFDJ = 0;
  BattleEndReason_BADALKDAOGH_JHELIECGPPF = 1;
  BattleEndReason_BADALKDAOGH_NDKMJMAPEFL = 2;
}

enum BattleEndStatus {
  BattleEndStatus_BATTLE_END_NONE = 0;
  BattleEndStatus_BATTLE_END_WIN = 1;
  BattleEndStatus_BATTLE_END_LOSE = 2;
  BattleEndStatus_BATTLE_END_QUIT = 3;
}

message BattleEquipment {
  uint32 id = 1;
  uint32 level = 2;
  uint32 promotion = 3;
  uint32 rank = 4;
}

message BattleRelic {
  uint32 id = 1;
  uint32 level = 2;
  uint32 main_affix_id = 3;
  repeated RelicAffix sub_affix_list = 4;
  uint32 unique_id = 5;
  uint32 set_id = 6;
  uint32 type = 7;
  uint32 rarity = 8;
}

message BattleStatistics {
  uint32 total_battle_turns = 1;
  uint32 total_auto_turns = 2;
  repeated uint32 avatar_id_list = 3 [packed = true];
  uint32 ultra_cnt = 4;
  double total_delay_cumulate = 5;
  double cost_time = 6;
  repeated AvatarBattleInfo battle_avatar_list = 7;
  uint32 round_cnt = 9;
  uint32 cocoon_dead_wave = 10;
  uint32 avatar_battle_turns = 11;
  uint32 monster_battle_turns = 12;
  uint32 challenge_score = 14;
  BattleEndReason end_reason = 19;
}

message ContentPackageData {
  repeated ContentPackageInfo content_package_list = 7;
  uint32 cur_content_id = 9;
}

message ContentPackageGetDataCsReq {
}

message ContentPackageGetDataScRsp {
  ContentPackageData data = 12;
  uint32 retcode = 14;
}

message ContentPackageInfo {
  uint32 content_id = 10;
  ContentPackageStatus status = 2;
}

enum ContentPackageStatus {
  ContentPackageStatus_ContentPackageStatus_None = 0;
  ContentPackageStatus_ContentPackageStatus_Init = 1;
  ContentPackageStatus_ContentPackageStatus_Doing = 2;
  ContentPackageStatus_ContentPackageStatus_Finished = 3;
  ContentPackageStatus_ContentPackageStatus_Release = 4;
}

message ContentPackageSyncDataScNotify {
  ContentPackageData data = 3;
}

message Dispatch {
  uint32 retcode = 1;
  string msg = 2;
  string top_sever_region_name = 3;
  repeated RegionInfo region_list = 4;
}

message EntityMotion {
  uint32 map_layer = 8;
  uint32 entity_id = 6;
  MotionInfo motion = 1;
}

message EquipRelic {
  uint32 type = 14;
  uint32 relic_unique_id = 1;
}

enum ExtraLineupType {
  ExtraLineupType_LINEUP_NONE = 0;
  ExtraLineupType_LINEUP_CHALLENGE = 1;
  ExtraLineupType_LINEUP_ROGUE = 2;
  ExtraLineupType_LINEUP_CHALLENGE_2 = 3;
  ExtraLineupType_LINEUP_CHALLENGE_3 = 4;
  ExtraLineupType_LINEUP_ROGUE_CHALLENGE = 5;
  ExtraLineupType_LINEUP_STAGE_TRIAL = 6;
  ExtraLineupType_LINEUP_ROGUE_TRIAL = 7;
  ExtraLineupType_LINEUP_ACTIVITY = 8;
  ExtraLineupType_LINEUP_BOXING_CLUB = 9;
  ExtraLineupType_LINEUP_TREASURE_DUNGEON = 11;
  ExtraLineupType_LINEUP_CHESS_ROGUE = 12;
  ExtraLineupType_LINEUP_HELIOBUS = 13;
  ExtraLineupType_LINEUP_TOURN_ROGUE = 14;
  ExtraLineupType_LINEUP_RELIC_ROGUE = 15;
  ExtraLineupType_LINEUP_ARCADE_ROGUE = 16;
  ExtraLineupType_LINEUP_MAGIC_ROGUE = 17;
  ExtraLineupType_LINEUP_FATE = 18;
  ExtraLineupType_LINEUP_GRID_FIGHT = 19;
}

message GateServer {
  string region_name = 6;
  string ex_resource_url = 13;
  string ip = 9;
  string lua_url = 2;
  bool use_tcp = 804;
  string ifix_url = 907;
  string asset_bundle_url = 7;
  uint32 port = 3;
  string base_asset_bundle_version_update_url = 206;
  string ifix_version = 1154;
}

message GetAllLineupDataCsReq {
}

message GetAllLineupDataScRsp {
  repeated LineupInfo lineup_list = 4;
  uint32 cur_index = 14;
  uint32 retcode = 2;
}

message GetAvatarDataCsReq {
  bool is_get_all = 10;
}

message GetAvatarDataScRsp {
  uint32 retcode = 15;
  bool is_get_all = 7;
  repeated Avatar avatar_list = 13;
  repeated uint32 skin_list = 4 [packed = true];
  repeated AvatarPathData avatar_path_data_info_list = 6;
  repeated uint32 basic_type_id_list = 8 [packed = true];
}

message GetBasicInfoCsReq {
}

message GetBasicInfoScRsp {
  uint32 gender = 3;
  bool is_gender_set = 5;
  int64 next_recover_time = 4;
  uint32 week_cocoon_finished_count = 7;
  uint32 cur_day = 15;
  uint32 gameplay_birthday = 6;
  uint32 exchange_times = 2;
  uint32 retcode = 12;
  int64 last_set_nickname_time = 11;
}

message GetCurBattleInfoCsReq {
}

message GetCurBattleInfoScRsp {
  uint32 retcode = 9;
  SceneBattleInfo battle_info = 14;
  BattleEndStatus last_end_status = 2;
}

message GetCurLineupDataCsReq {
}

message GetCurLineupDataScRsp {
  LineupInfo lineup = 7;
  uint32 retcode = 5;
}

message GetCurSceneInfoCsReq {
}

message GetCurSceneInfoScRsp {
  SceneInfo scene = 4;
  uint32 retcode = 8;
}

message Item {
  uint32 main_affix_id = 4;
  uint32 rank = 3;
  uint32 unique_id = 11;
  uint32 num = 5;
  uint32 level = 14;
  uint32 promotion = 12;
  uint32 item_id = 15;
}

message ItemList {
  repeated Item item_list = 1;
}

message LineupAvatar {
  uint32 id = 15;
  AvatarType avatar_type = 5;
  uint32 satiety = 7;
  SpBarInfo sp_bar = 8;
  uint32 slot = 6;
  uint32 hp = 11;
}

message LineupInfo {
  uint32 index = 2;
  uint32 leader_slot = 8;
  uint32 game_story_line_id = 4;
  repeated LineupAvatar avatar_list = 14;
  string name = 9;
  ExtraLineupType extra_lineup_type = 7;
  uint32 plane_id = 12;
  uint32 mp = 6;
  bool is_virtual = 1;
  uint32 max_mp = 11;
}

message Material {
  uint32 num = 9;
  uint32 tid = 12;
}

message MotionInfo {
  Vector rot = 5;
  Vector pos = 2;
}

message PVEBattleResultCsReq {
  BattleStatistics stt = 10;
  uint32 client_res_version = 4;
  uint32 battle_id = 7;
  BattleEndStatus end_status = 13;
  uint32 stage_id = 14;
}

message PVEBattleResultScRsp {
  BattleEndStatus end_status = 9;
  uint32 retcode = 7;
  ItemList drop_data = 14;
  repeated BattleAvatar battle_avatar_list = 8;
  ItemList multiple_drop_data = 12;
  uint32 stage_id = 10;
  uint32 battle_id = 6;
}

enum PlatformType {
  PlatformType_EDITOR = 0;
  PlatformType_IOS = 1;
  PlatformType_ANDROID = 2;
  PlatformType_PC = 3;
  PlatformType_WEB = 4;
  PlatformType_WAP = 5;
  PlatformType_PS4 = 6;
  PlatformType_NINTENDO = 7;
  PlatformType_CLOUD_ANDROID = 8;
  PlatformType_CLOUD_PC = 9;
  PlatformType_CLOUD_IOS = 10;
  PlatformType_PS5 = 11;
  PlatformType_MAC = 12;
  PlatformType_CLOUD_MAC = 13;
  PlatformType_CLOUD_WEB_ANDROID = 20;
  PlatformType_CLOUD_WEB_IOS = 21;
  PlatformType_CLOUD_WEB_PC = 22;
  PlatformType_CLOUD_WEB_MAC = 23;
  PlatformType_CLOUD_WEB_TOUCH = 24;
  PlatformType_CLOUD_WEB_KEYBOARD = 25;
  PlatformType_CLOUD_DOUYIN_IOS = 27;
  PlatformType_CLOUD_DOUYIN_ANDROID = 28;
}

message PlayerBasicInfo {
  string nickname = 1;
  uint32 level = 2;
  uint32 exp = 3;
  uint32 stamina = 4;
  uint32 mcoin = 5;
  uint32 hcoin = 6;
  uint32 scoin = 7;
  uint32 world_level = 8;
}

message PlayerGetTokenCsReq {
  uint32 platform = 3;
  uint32 uid = 6;
}

message PlayerGetTokenScRsp {
  uint32 uid = 11;
  uint32 retcode = 13;
}

message PlayerHeartBeatCsReq {
  uint64 client_time_ms = 12;
}

message PlayerHeartBeatScRsp {
  uint64 server_time_ms = 9;
  uint64 client_time_ms = 10;
  uint32 retcode = 6;
}

message PlayerLoginCsReq {
  PlatformType platform = 4;
  uint32 client_res_version = 3;
  uint64 login_random = 11;
}

message PlayerLoginFinishCsReq {
}

message PlayerLoginFinishScRsp {
  uint32 retcode = 13;
}

message PlayerLoginScRsp {
  PlayerBasicInfo basic_info = 11;
  uint64 server_timestamp_ms = 13;
  int32 cur_timezone = 1;
  uint64 login_random = 9;
  uint32 retcode = 8;
  uint32 stamina = 15;
}

message PlayerSyncScNotify {
  repeated Material material_list = 8;
  PlayerBasicInfo basic_info = 7;
}

message QuickStartCocoonStageCsReq {
  uint32 world_level = 9;
  uint32 cocoon_id = 5;
  uint32 wave = 11;
}

message QuickStartCocoonStageScRsp {
  SceneBattleInfo battle_info = 2;
  uint32 wave = 11;
  uint32 retcode = 4;
  uint32 cocoon_id = 12;
}

message RegionInfo {
  string name = 1;
  string title = 2;
  string dispatch_url = 3;
  string env_type = 4;
  string display_name = 5;
  string stop_desc = 6;
}

message RelicAffix {
  uint32 affix_id = 1;
  uint32 cnt = 2;
  uint32 step = 3;
}

message SceneActorInfo {
  AvatarType avatar_type = 4;
  uint32 base_avatar_id = 5;
  uint32 map_layer = 7;
  uint32 uid = 1;
}

message SceneBattleInfo {
  uint32 monster_wave_length = 4;
  uint32 battle_id = 8;
  uint32 stage_id = 10;
  uint32 logic_random_seed = 12;
  repeated BattleBuff buff_list = 3;
  repeated SceneMonsterWave monster_wave_list = 1;
  uint32 world_level = 14;
  repeated BattleAvatar battle_avatar_list = 2;
  uint32 rounds_limit = 11;
}

message SceneEntityGroupInfo {
  repeated SceneEntityGroupInfo_PropertyMapEntry property_map = 10;
  repeated SceneEntityInfo entity_list = 3;
  uint32 state = 12;
  uint32 group_id = 2;
}

message SceneEntityGroupInfo_PropertyMapEntry {
  string key = 1;
  int32 value = 2;
}

message SceneEntityInfo {
  uint32 entity_id = 10;
  uint32 inst_id = 2;
  MotionInfo motion = 1;
  uint32 group_id = 13;
  oneof entity {
    SceneActorInfo actor = 8;
    SceneNpcMonsterInfo npc_monster = 14;
    SceneNpcInfo npc = 4;
    ScenePropInfo prop = 9;
  }
}

message SceneEntityMoveCsReq {
  uint32 entry_id = 5;
  repeated EntityMotion entity_motion_list = 4;
  uint64 interact_id = 10;
}

message SceneEntityMoveScRsp {
  repeated EntityMotion entity_motion_list = 7;
  uint32 retcode = 10;
}

message SceneIdentifier {
  uint32 game_story_line_id = 10;
  uint32 content_id = 3;
  uint32 floor_id = 12;
  TeleportInfo teleport_info = 1871;
}

message SceneInfo {
  uint32 entry_id = 6;
  uint32 floor_id = 13;
  uint32 plane_id = 7;
  uint32 leader_entity_id = 14;
  uint32 world_id = 10;
  repeated SceneEntityInfo entity_list = 8;
  SceneIdentifier scene_identifier = 770;
  uint32 game_mode_type = 1;
  repeated SceneEntityGroupInfo entity_group_list = 329;
}

message SceneMonster {
  uint32 max_hp = 5;
  uint32 cur_hp = 4;
  uint32 monster_id = 3;
}

message SceneMonsterWave {
  uint32 battle_wave_id = 1;
  uint32 battle_stage_id = 10;
  repeated SceneMonster monster_list = 5;
  SceneMonsterWaveParam monster_param = 12;
}

message SceneMonsterWaveParam {
  uint32 level = 14;
  uint32 hard_level_group = 12;
  uint32 elite_group = 7;
}

message SceneNpcInfo {
  uint32 npc_id = 7;
}

message SceneNpcMonsterInfo {
  uint32 monster_id = 15;
  uint32 event_id = 8;
  uint32 world_level = 2;
}

message ScenePropInfo {
  uint32 prop_state = 15;
  uint32 life_time_ms = 7;
  uint32 prop_id = 5;
  uint64 create_time_ms = 2;
}

message SpBarInfo {
  uint32 cur_sp = 1;
  uint32 max_sp = 2;
}

message StartCocoonStageCsReq {
  uint32 world_level = 14;
  uint32 wave = 9;
  uint32 prop_entity_id = 3;
  uint32 cocoon_id = 4;
}

message StartCocoonStageScRsp {
  uint32 wave = 3;
  uint32 retcode = 13;
  SceneBattleInfo battle_info = 15;
  uint32 challenge_cnt = 14;
  uint32 prop_entity_id = 11;
  uint32 cocoon_id = 6;
}

message SyncLineupNotify {
  LineupInfo lineup = 12;
  repeated SyncLineupReason reason_list = 9 [packed = false];
}

enum SyncLineupReason {
  SyncLineupReason_SyncLineupReason_SyncReasonNone = 0;
  SyncLineupReason_SyncLineupReason_SyncReasonMpAdd = 1;
  SyncLineupReason_SyncLineupReason_SyncReasonMpAddPropHit = 2;
  SyncLineupReason_SyncLineupReason_SyncReasonHpAdd = 3;
  SyncLineupReason_SyncLineupReason_SyncReasonHpAddPropHit = 4;
  SyncLineupReason_SyncLineupReason_SyncReasonMpMaxChangedPermanent = 5;
  SyncLineupReason_SyncLineupReason_SyncReasonMpMaxChangedByModifier = 6;
}

message TeleportInfo {
  uint32 reason = 4;
  uint32 teleport_id = 7;
}

message Vector {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}
